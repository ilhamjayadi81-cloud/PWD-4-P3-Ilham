<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Latihan</title>
    <style>
        body  { font-family: "Times New Roman", serif; font-size: 20px; }
        table { border-collapse: separate; border-spacing: 2px; border: 1px solid #555; }
        td    { border: 1px solid #555; padding: 3px 4px; }
        .hijau  { background-color: lime; }
        .kuning { background-color: yellow; }
        .cyan   { background-color: cyan; }
        .putih  { background-color: white; }
    </style>
</head>
<body>

    <h3>Soal 1: Bilangan genap dari 1 sampai 10</h3>
    <script>
        for (var i = 1; i <= 10; i++) {
            if (i % 2 === 0) {
                document.write(i + "<br>");
            }
        }
    </script>
