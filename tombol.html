<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Tombol Scroll to Top</title>
    <style>
        /* Mengatur dasar halaman */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
            background-color: #f4f4f9;
            color: #333;
        }

        /* Konten halaman dengan tinggi > 2000px agar bisa di-scroll */
        .content {
            height: 2500px;
            background: linear-gradient(to bottom, #ffffff, #dcdde1);
            padding: 20px;
            border-radius: 8px;
        }

        h1 {
            color: #2f3640;
        }

        /* Styling Tombol Kembali ke Atas */
        #scrollTopBtn {
            display: none; /* Awalnya bersifat hidden */
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 99;
            background-color: #e74c3c;
            color: white;
            border: none;
            outline: none;
            cursor: pointer;
            padding: 15px 18px;
            border-radius: 50%;
            font-size: 18px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            
            /* Ketentuan 3: Nilai opacity awal dan efek hover */
            opacity: 0.6;
            transition: opacity 0.3s ease, background-color 0.3s ease;
        }

        #scrollTopBtn:hover {
            opacity: 1.0; /* Ketika hover, opacity menjadi 100% */
            background-color: #c0392b;
        }
    </style>
</head>
<body>

    <div class="content" id="top">
        <h1>Top Page Header</h1>
        <p>Gulir (scroll) ke bawah halaman ini hingga melebihi 500px untuk memunculkan tombol "Kembali ke Atas" di pojok kanan bawah.</p>
        <p>Kedalaman halaman ini diatur lebih dari 2000px.</p>
        
        <!-- Tambahan teks sebagai penanda area bawah -->
        <div style="margin-top: 2200px;">
            <h3>Anda sudah berada di bagian bawah halaman.</h3>
            <p>Silakan klik tombol panah di kanan bawah untuk kembali ke atas.</p>
        </div>
    </div>

    <!-- Tombol Back to Top -->
    <button id="scrollTopBtn" onclick="scrollToTop()" title="Kembali ke atas">⬆</button>

    <script>
        // Mendapatkan elemen tombol
        let calcScrollValue = () => {
            let scrollBtn = document.getElementById("scrollTopBtn");
            let pos = document.documentElement.scrollTop || document.body.scrollTop;
            
            // Jika scroll down > 500px, tombol akan muncul (display: block), jika tidak maka hidden (display: none)
            if (pos > 500) {
                scrollBtn.style.display = "block";
            } else {
                scrollBtn.style.display = "none";
            }
        };

        // Fungsi untuk mengembalikan halaman ke posisi atas (top page header) secara mulus (smooth)
        function scrollToTop() {
            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }

        // Menjalankan fungsi saat halaman di-scroll
        window.onscroll = calcScrollValue;
    </script>

</body>
</html>
